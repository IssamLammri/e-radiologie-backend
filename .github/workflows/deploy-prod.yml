name: Deploy production

on:
    push:
        branches:
            - master

    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      cd ~/projets/e-radiologie-backend

                      echo "Pull latest master..."
                      git pull origin master

                      echo "Build and start containers..."
                      docker compose up -d --build

                      echo "Install Composer dependencies..."
                      docker exec e_radiologie_backend_php composer install \
                          --no-dev \
                          --optimize-autoloader \
                          --no-interaction

                      echo "Run database migrations..."
                      docker exec e_radiologie_backend_php php bin/console \
                          doctrine:migrations:migrate \
                          --no-interaction \
                          --env=prod

                      echo "Clear Symfony cache..."
                      docker exec e_radiologie_backend_php php bin/console \
                          cache:clear \
                          --env=prod

                      echo "Warm Symfony cache..."
                      docker exec e_radiologie_backend_php php bin/console \
                          cache:warmup \
                          --env=prod

                      echo "Deployment completed."
