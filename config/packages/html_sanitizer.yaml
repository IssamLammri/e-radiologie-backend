framework:
    html_sanitizer:
        sanitizers:
            app.editorial:
                allow_safe_elements: true
                allow_elements:
                    img: ['src', 'alt', 'width', 'height']
                allowed_link_schemes: ['https', 'http', 'mailto']
                allowed_media_schemes: ['https', 'http']
                allow_relative_links: true
                allow_relative_medias: true
                max_input_length: 200000
